name: Build Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.1.0). Leave empty for artifacts-only run.'
        required: false
      release_title:
        description: 'Release title (optional)'
        required: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenjp2-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run build:linux:all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: dist/*.AppImage

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DEB
          path: dist/*.deb

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: RPM
          path: dist/*.rpm

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_title }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
