name: Build Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.2.0). Leave empty for artifacts-only run.'
        required: false
      release_title:
        description: 'Release title (optional)'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenjp2-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run build:linux:all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: dist/*.AppImage

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DEB
          path: dist/*.deb

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: RPM
          path: dist/*.rpm

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''

    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Windows-Installer
          path: dist/windows

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: AppImage
          path: dist/linux

      - name: Download DEB
        uses: actions/download-artifact@v4
        with:
          name: DEB
          path: dist/linux

      - name: Download RPM
        uses: actions/download-artifact@v4
        with:
          name: RPM
          path: dist/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_title || github.ref_name }}
          files: |
            dist/windows/*
            dist/linux/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
